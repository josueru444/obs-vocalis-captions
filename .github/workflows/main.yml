name: Compilar y Release Manual

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Versión del Release (ej: v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_notes:
        description: 'Notas de la versión / Descripción'
        required: false
        default: 'Novedades y correcciones en esta versión.'
      is_draft:
        description: '¿Crear como Borrador (Oculto hasta que lo publiques)?'
        type: boolean
        default: true
      create_release:
        description: '¿Crear GitHub Release con los archivos generados?'
        type: boolean
        default: true

jobs:
  build:
    uses: ./.github/workflows/build-project.yaml
    secrets: inherit

  release:
    needs: build
    if: inputs.create_release == true || github.event.inputs.create_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar artefactos
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Crear Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
          tag_name: ${{ inputs.version_tag }}
          name: Release ${{ inputs.version_tag }}
          body: ${{ inputs.release_notes }}
          draft: ${{ inputs.is_draft }}
          prerelease: false
          generate_release_notes: true


